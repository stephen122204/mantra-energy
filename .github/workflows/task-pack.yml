name: Task pack contracts
on:
  pull_request:
    branches: ['research/energy-diagnosis']
  push:
    branches: ['research/energy-diagnosis']
    paths:
      - 'studies/energy_diagnosis/moe/task_pack.py'
      - 'tests/test_task_pack.py'
      - 'tests/test_agent_protocol.py'
      - 'studies/energy_diagnosis/agent_protocol.py'
      - 'tests/test_verification_artifact.py'
      - 'studies/energy_diagnosis/local_run.py'
      - 'tests/test_token_budget_audit.py'
      - 'studies/energy_diagnosis/moe/audit_token_budget.py'
      - 'tests/test_prepared_numerical.py'
      - 'studies/energy_diagnosis/moe/numerical_workload.py'
      - 'tests/test_task_pack_pipeline.py'
      - 'tests/test_task_pack_cli.py'
      - 'studies/energy_diagnosis/moe/run.py'
      - 'studies/energy_diagnosis/moe/task_pack_fixture.py'
      - 'tests/test_etl_workload.py'
      - 'studies/energy_diagnosis/moe/etl_workload.py'
      - '.github/workflows/task-pack.yml'
permissions:
  contents: read
jobs:
  task-pack-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install -r requirements-study.txt
      - run: python -X utf8 -m pytest -q tests/test_agent_protocol.py tests/test_task_pack.py tests/test_etl_workload.py tests/test_task_pack_pipeline.py tests/test_task_pack_cli.py tests/test_prepared_numerical.py tests/test_token_budget_audit.py tests/test_verification_artifact.py
