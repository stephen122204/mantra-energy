name: Task pack contracts
on:
  pull_request:
    branches: ['research/energy-diagnosis']
  push:
    branches: ['research/energy-diagnosis']
    paths:
      - 'studies/energy_diagnosis/moe/task_pack.py'
      - 'tests/test_task_pack.py'
      - '.github/workflows/task-pack.yml'
permissions:
  contents: read
jobs:
  task-pack-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install -r requirements-study.txt
      - run: python -X utf8 -m pytest -q tests/test_task_pack.py
