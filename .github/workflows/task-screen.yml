name: Task screen qualification
on:
  pull_request:
    branches: ['research/energy-diagnosis', 'stephen/campaign-operations']
  push:
    branches: ['stephen/task-screen-pack']
permissions:
  contents: read
jobs:
  program-and-pack:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install -r requirements-study.txt
      - run: python -X utf8 -m pytest -q tests/test_program_workload.py tests/test_program_pipeline.py tests/test_task_pack.py tests/test_task_pack_cli.py tests/test_task_pack_pipeline.py
  repository-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: networkx/networkx
          ref: 2acf1590f82757c01a57b81b8c5dfb79e60aa416
          path: .task-screen-networkx
      - run: python -m pip install -r requirements-study.txt -r requirements-task-screen.txt
      - name: Run all repository cases without prerequisite skips
        shell: bash
        run: |
          export ALEMS_NETWORKX_SOURCE="$GITHUB_WORKSPACE/.task-screen-networkx"
          export ALEMS_REPO_TOOL_PYTHON="$(command -v python)"
          python -m pytest -q tests/test_repo_workload.py
