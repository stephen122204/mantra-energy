name: Energy diagnosis setup

on:
  push:
    branches: ['research/energy-diagnosis']
    paths:
      - 'docs/agent-context/**'
      - 'studies/energy_diagnosis/**'
      - 'scripts/check_energy_diagnosis_setup.py'
      - 'scripts/publish_agent_context.py'
      - 'scripts/tests/test_publish_agent_context.py'
      - 'tests/test_data_analysis_workload.py'
      - 'tests/test_study_contracts.py'
      - 'tests/test_campaign_ledger.py'
      - 'tests/test_moe_*.py'
      - 'core/execution/adapters/**'
      - 'core/execution/agentic.py'
      - 'core/execution/linear.py'
      - 'tests/test_openai_compat_adapter.py'
      - 'tests/test_executor_adapter_failures.py'
      - 'AGENTS.md'
      - '.github/workflows/energy-diagnosis-setup.yml'
  pull_request:
    branches: ['research/energy-diagnosis']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-diagnosis-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check portable context and planning integrity (no hardware jobs)
        run: python3 scripts/check_energy_diagnosis_setup.py
      - name: Test isolated context publishing with disposable Git repositories
        run: python3 -m unittest discover -s scripts/tests -p test_publish_agent_context.py -v
      - name: Test the ED-03 data-analysis workload and verifier from a clean checkout
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tests/test_data_analysis_workload.py
      - name: Test the ED-01 shared record contracts and component bridges
        run: python3 -m pytest -q tests/test_study_contracts.py
      - name: Test the ED-04 ledger, recovery, and exports
        run: python3 -m pytest -q tests/test_campaign_ledger.py

  windows-ledger:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test the portable ledger on native Windows (fixture only)
        run: python -X utf8 -m unittest discover -s tests -p test_campaign_ledger.py -v

  adapter-fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install lightweight adapter fixture dependencies
        run: python -m pip install --quiet pytest requests psutil
      - name: Test provider responses and failure accounting (no model or hardware)
        run: >-
          python -X utf8 -m pytest -q
          tests/test_openai_compat_adapter.py
          tests/test_executor_adapter_failures.py

  integrated-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install portable study dependencies
        run: python -m pip install -r requirements-study.txt
      - name: Verify components and complete HTTP/tool/measurement/ledger fixtures
        run: python -X utf8 scripts/check_study_runtime.py

  moe-control-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install portable study dependencies
        run: python -m pip install -r requirements-study.txt
      - name: Test owned model worker, controls, tools, and ledger without GPU
        run: python -X utf8 -m pytest -q tests/test_moe_pipeline.py tests/test_moe_window_audit.py tests/test_moe_repair_contract.py tests/test_moe_expanded_tasks.py tests/test_moe_prefix.py tests/test_moe_planning.py tests/test_moe_query_workload.py
      - name: Install optional local analytical query engine
        run: python -m pip install duckdb==1.5.0
      - name: Test real analytical engine with small generated inputs
        run: python -X utf8 -m pytest -q tests/test_moe_query_workload.py
      - name: Compile and test native transfer lifecycle without CUDA
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_moe_native_lifecycle.py

  session-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install CPU-only numerical diagnostic dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest transformers==5.3.0 accelerate==1.13.0
      - name: Test fixed-prefix captures and session helpers without GPU or SSH
        run: python -m pytest -q tests/test_fixed_forward_diagnostics.py tests/test_session_diagnostics.py
      - name: Check bootstrap shell syntax without installing or downloading models
        run: bash -n studies/energy_diagnosis/diagnostics/setup_a100_node.sh
