name: Numerical workload contracts
on:
  pull_request:
    branches: ['research/energy-diagnosis']
  push:
    branches: ['research/energy-diagnosis']
    paths:
      - 'studies/energy_diagnosis/moe/numerical_workload.py'
      - 'tests/test_numerical_workload.py'
      - '.github/workflows/numerical-workload.yml'
permissions:
  contents: read
jobs:
  numerical-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install pytest
      - run: python -X utf8 -m pytest -q tests/test_numerical_workload.py
